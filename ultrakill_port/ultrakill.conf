# =============================================================================
# ultrakill.conf - tuning do port SEM recompilar nada (uma opcao por linha,
# KEY=VALOR). Este arquivo e lido por ultrakill_start.sh ANTES das sondas, entao
# o que voce poe aqui vence o default do launcher. Linhas com '#' sao ignoradas.
#
# !!! CUIDADO COM QUEBRA DE LINHA: salve em LF (unixin), nao CRLF. O launcher
# remove os '\r' automaticamente, mas se voce editar no Windows e salvar mal,
# valores viram "1\r" e o knob para de funcionar.
#
# CONSOLE ALVO: TRIMUI SMART PRO (spruceOS, aarch64, PowerVR GE8300, 1280x720,
# 1 GB RAM, sem touch screen). Os knobs marcados (R36S) so fazem sentido naquele
# box e podem ficar ignorados aqui.
# =============================================================================

# ---- LOADER -----------------------------------------------------------------
# bender  (PADRAO) : loader com FONTE no port (ultrakill/bender/unity_probe.c,
#                943 KB). E o que chega mais longe no ULTRAKILL: passa do
#                managed, registra os natives, abre EGL/GLES e ENTRA no 1o
#                nativeRender. Ja traz input real (nativeInjectEvent com
#                KeyEvent/MotionEvent falsos), HUD, teclado virtual, keymap
#                editavel dentro do jogo, mapeamento de sticks em toque e o
#                bridge de som (bender/bender_opensles.c -> audio_bridge/).
# bridge        : nosso wrapper SDL nativo (wrapper/*.c + gamedata/bin/ultrakill),
#                codigo aberto, mais simples de mexer. NAO e preciso escolher
#                na forca: se o BENDER morrer por sinal, o launcher roda o
#                bridge sozinho.
# Os DOIS loaders tem mouse virtual (START+R1 liga, B clica) - ver secao INPUT.
ULTRAKILL_LOADER=bender

# ---- BOX / GPU --------------------------------------------------------------
# O launcher detecta sozinho (mali se /dev/mali0 existe; senao PowerVR). Forque
# so se a deteccao errar:  ULTRAKILL_BOX=tsp | r36s
# Pilha de GPU:  pvr (EGL/GLES do sistema - TSP) | mali (blob empacotado - R36S)
#                | swrast (Mesa software, lento, ultimo recurso)
ULTRAKILL_GL_BACKEND=pvr

# ---- RESOLUCAO INTERNA ------------------------------------------------------
# Painel do TSP e 1280x720. Metade = 640x360 (o default detectado). Menor =
# mais FPS; na GE8300 com 1 GB de RAM 640x360 e o melhor custo/beneficio.
# (Deixe comentado para usar o default automatico do launcher.)
#INT_W=640
#INT_H=360

# ---- MOUSE VIRTUAL (o TSP nao tem touch nem mouse) --------------------------
# Como funciona no jogo:
#   START + R1  -> LIGA / DESLIGA o mouse virtual
#   B           -> CLIQUE (pressionar = touch down, soltar = touch up)
#   ANALOGICO DIREITO -> move o ponteiro (o ESQUERDO continua sendo movimento)
#   SELECT + START (1 s) -> sai do port e devolve ao ES
ULTRAKILL_MOUSE=1
# Qual stick move o ponteiro: right | left | dpad | none
# 'right' e o melhor num FPS: voce anda com o esquerdo e mira/clica com o
# direito. 'dpad' tambem move (passo discreto). 'none' deixa o ponteiro parado
# e o B virando clique em qualquer lugar.
ULTRAKILL_MOUSE_STICK=right
# Velocidade em pixels/s na deflexao total (100..4000). Aumente se o ponteiro
# parecer lento; diminua se passar do botao.
ULTRAKILL_MOUSE_SPEED=1100
# Zona morta do analgico (0..30000) - evita deriva do ponteiro com o stick solto.
ULTRAKILL_MOUSE_DEADZONE=5000
# Como o clique e injetado no Unity:
#   touch = evento de DEDO (TOOL_TYPE_FINGER). E o que a interface MOBILE do
#           ULTRAKILL le, e o Unity emula Input.mousePosition a partir do toque.
#           Deixe assim.
#   mouse = evento de MOUSE Android (HOVER_MOVE + BUTTON_DOWN/UP). Use se o
#           jogo ignorar toques e so ler mouse (Cursor.lockState etc).
ULTRAKILL_MOUSE_MODE=touch
# Recombe o combo / o botao de clique se preferir:
#   ULTRAKILL_MOUSE_TOGGLE=start+r1 | select+r1 | l3+r3 | l1+r1
#   ULTRAKILL_MOUSE_CLICK=b | x | y
ULTRAKILL_MOUSE_TOGGLE=start+r1
ULTRAKILL_MOUSE_CLICK=b
# ---- MOUSE VIRTUAL no loader BENDER (o padrao) ------------------------------
# O BENDER (bender/unity_probe.c) tem o proprio sistema de mouse, com HUD de
# mira, velocidade ajustavel por hotkey e ate teclado/keymap editavel dentro do
# jogo. Os atalhos dele:
#   START+R1            liga/DESLIGA o mouse virtual   (novo, rev -L)
#   GUIDE|L1+R1  + DOWN antigo atalho do mesmo toggle (continua valendo)
#   B (e A / R3)        clique; movimento = analgico direito ou D-pad
#   SELECT+START        sai do port
#   GUIDE+X / GUIDE+Y   abre os editores de area de stick / mapa de teclas
# Ajustes sem recompilar:
#   BENDER_MOUSE_CLICK_B=0        tira o B do clique (deixa so A/R3)
#   BENDER_MOUSE_TOGGLE_START_R1=0 desliga o atalho START+R1
#   BENDER_FN_RAW_BUTTON=<n>      outro botao que vale como FN
#   BENDER_FRAME_LOOP_FRAMES=<n>  teto de frames do loader (0 = sem teto)
BENDER_MOUSE_CLICK_B=1
BENDER_MOUSE_TOGGLE_START_R1=1

# ---- FRAME RATE / ORCAMENTO DE 30 FPS ---------------------------------------
# 30 e o alvo realista no TrimUI Smart Pro (PowerVR GE8300 + 1 GB). O budget e
# montado assim (mesma logica do Cuphead, que fecha em 30):
#   1) resolucao interna = metade do painel  (1280x720 -> 640x360)
#   2) pacing do loader = alvo de 33333 us por frame (30 FPS)
#   3) qualidade 0 (sombras/post nas variantes mais baratas)
# ULTRAKILL_TARGET_FPS: 30 | 45 | 60 | 0 (=0 sem teto, deixa o vsync mandar)
ULTRAKILL_TARGET_FPS=30
# Backend de video do SDL no spruceOS. 'mali' e o que os ports desta caixa usam
# (GTA SA, McpeLauncher, Cuphead): o SDL do firmware conduz o painel por ele.
# 'kmsdrm' falha aqui porque a ES segura DRM master -> "Can't window GBM/EGL".
SDL_VIDEODRIVER_TSP=mali

# ---- INPUT / GAMEPAD --------------------------------------------------------
# O launcher monta um gamecontrollerdb privado com a linha do pad do TSP
# (a:b1,b:b0) porque o pad virtual do trimui_inputd e Xbox-360-por-fora mas
# Nintendo-por-dentro: sem isso A e B ficam trocados e o clique do mouse
# virtual cairia no botao errado. 0 desliga a correcao.
ULTRAKILL_TSP_PAD_FIX=1

# ---- WATCHDOGS DO RENDER (loader bender) ------------------------------------
# O log de 04/11 mostrou o boot PARADO no 1o nativeRender com o watchdog de idle
# em apenas 20 s. Agora com folga real, e ajustavel:
#   IDLE   = segundos sem progresso antes do snapshot de stall
#   ABSOLUTE = teto total do render loop; EXTEND = extensao quando ha progresso
BENDER_RENDER_IDLE_WATCHDOG_SEC=90
BENDER_RENDER_ABSOLUTE_WATCHDOG_SEC=900
BENDER_RENDER_EXTEND_SEC=120
# Play Core (Google Play). Com 1, o Unity acha que o Play Services NAO existe e
# nao abre o fluxo de "instalar asset pack" (Dialog + Runnable na UI thread) -
# foi esse Runnable que travou o 1o frame (NoSuchMethodError em Runnable.run).
# Use 1 como experimento se o boot voltar a parar em libunity+0x2e38ac.
BENDER_PLAYCORE_MISSING=0

# ---- SOM --------------------------------------------------------------------
# ULTRAKILL_NO_SOUND=0 (PADRAO NOVO, loader bender): SOM LIGADO. Antes era 1
#   (FMOD em NOSOUND) porque o init de audio travava o 1o frame - e o stub
#   libOpenSLES sem vtable derrubava o processo exatamente ali. Hoje existe o
#   bridge OpenSL ES -> SDL2 verdadeiro, entao nao ha mais motivo para rodar
#   mudo. Se o boot voltar a parar em AudioManager.getDevices, ponha 1 para
#   isolar (ai o problema e o dispositivo de audio, nao o loader).
ULTRAKILL_NO_SOUND=0
# No loader bridge o mesmo interruptor chama-se ULTRAKILL_AUDIO:
#   1 (padrao) abre o dispositivo SDL; 0 = modo relogio (mudo, mas nao trava).
# Fonte do libOpenSLES.so dos dois loaders: bender/bender_opensles.c (o bridge
# comprovado). wrapper/include/sles_shim.h e so a referencia do ABI.
ULTRAKILL_AUDIO=1
# Taxa/canal/periodo forceados (0 = usa o que o jogo pede). Util se o ALSA do
# TSP so aceita 48 kHz: ULTRAKILL_AUDIO_RATE=48000
#ULTRAKILL_AUDIO_RATE=0
#ULTRAKILL_AUDIO_CHANS=0
#ULTRAKILL_AUDIO_BUF_MS=20
# 1 = loga cada call OpenSL (muito verboso, so para diagnosticar audio).
#ULTRAKILL_AUDIO_DEBUG=1
# AVISO: alem disto, o proprio jogo tinha os volumes zerados em
# data/files/Preferences/Prefs.json (allVolume/musicVolume = 0.0). O launcher
# roda tools/tune_prefs.py a cada boot para garantir volume > 0 (backup em
# Prefs.json.bak-ark). Para desfazer: restaure esse .bak-ark.

# ---- TETO DE TEMDO DO BOOT -------------------------------------------------
# O bridge roda sem teto por padrao (joga ate voce sair). Estes tetos so
# limitam quando algo trava, para o port devolver o ES sozinho:
#   ULTRAKILL_MAX_SEC=0      segundos maximos do loop de render (0 = sem teto)
#   ULTRAKILL_MAX_FRAMES=0   frames maximos (0 = sem teto)
#   BRIDGE_TIMEOUT_SEC=900   teto externo do launcher (timeout -s INT)
#ULTRAKILL_MAX_SEC=0
#ULTRAKILL_MAX_FRAMES=0
#BRIDGE_TIMEOUT_SEC=900

# ---- FEEDBACK NA TELA -------------------------------------------------------
# 1 (PADRAO): enquanto o boot aquece, o launcher escreve /tmp/status_message.txt
# e /dev/console com o tempo decorrido + fase atual.
ULTRAKILL_PROGRESS=1

# ---- (R36S/BENDER) KNABS DO OUTRO LOADER ------------------------------------
