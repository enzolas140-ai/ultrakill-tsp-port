#ULTRAKILL_RENDER_SCALE_75=0     # BENDER: 480x360 -> 640x480
#ULTRAKILL_FRAME_PACING=auto60   # BENDER: compat | auto60 | uncapped
#ULTRAKILL_NO_SOUND=1            # BENDER: FMOD em NOSOUND
#ULTRAKILL_FB_PRESENT=1          # BENDER: presente via /dev/fb0
#ULTRAKILL_FB_KMS=FB             # BENDER: BENDER_UK_KMS = FB|GL|AUTO|NONE
#ULTRAKILL_FORCE_LOW_QUALITY=1   # PlayerPrefs UnityGraphicsQuality=0
#ULTRAKILL_SKIP_INTRO=0          # BENDER: pula FMV de abertura
#BENDER_GPU_WATCHDOG_SEC=45
#BENDER_MAX_SEC=600
#KMS_MODE=off                     # nunca assume o CRTC (preto ao sair)
#ULTRAKILL_NO_FB=1                # nao tenta /dev/fb0
#GL backend mali exige graphics/libMali.so; sem ele o launcher cai em pvr/swrast.
#ULTRAKILL_GL_ALLOW_SYSTEM_MALI=1
