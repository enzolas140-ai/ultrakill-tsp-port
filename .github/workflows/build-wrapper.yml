name: build wrapper (arm64)

# Gatilha:
#   - push em qualquer branch com .github/workflows/build-wrapper.yml + ultrakill_port/
#   - disparo manual via Actions tab -> Build wrapper -> Run workflow
on:
  push:
    paths:
      - 'ultrakill_port/wrapper/**'
      - 'ultrakill_port/CMakeLists.txt'
      - '.github/workflows/build-wrapper.yml'
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain host (so p/ docker)
        run: |
          # nada a instalar no host alem do docker (pre-instalado no runner arm)
          dpkg-architecture -qDEB_HOST_ARCH || true

      - name: configure + build (dentro debian:bullseye = glibc 2.31)
        # IMPORTANTISSIMO: buildar no Ubuntu 24.04 (glibc 2.39) liga os .so
        # contra GLIBC_2.34 (pthread merged na libc) - e o ArkOS/R36S roda
        # glibc ~2.33 -> ate o tee/grep do sistema quebrava com LD_PRELOAD
        # do shim. Bullseye exporta glibc 2.31: roda em QUALQUER device.
        run: |
          # Docker Hub anonimo da "toomanyrequests" nos runners ARM -> espelho
          # gcr + tentativas com backoff.
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          IMG=debian:bullseye-slim
          ok=0
          for i in 1 2 3 4 5; do
            if docker pull -q $IMG; then ok=1; break; fi
            sleep $((i*20))
          done
          [ "$ok" = 1 ] || { echo "falhou pull $IMG"; docker pull -q public.ecr.aws/debian/debian:bullseye-slim && IMG=public.ecr.aws/debian/debian:bullseye-slim; }
          docker run --rm -v "$PWD:/src" -w /src/ultrakill_port/wrapper "$IMG" bash -ec '
            # bullseye e EOL em 2026 -> mirrors normais dao 404; usar o
            # archive oficial do Debian.
            cat > /etc/apt/sources.list <<EOF
          deb http://archive.debian.org/debian bullseye main
          deb http://archive.debian.org/debian-security bullseye-security main
          EOF
            apt-get -o Acquire::Check-Valid-Until=false update
            apt-get install -y --no-install-recommends \
              build-essential cmake pkg-config ninja-build \
              libsdl2-dev zlib1g libdrm-dev
            ./build.sh arm64
            # zlib fisicamente ausente no ArkOS - embalamos junto (<=2.31)
            Z=$(ls /usr/lib/aarch64-linux-gnu/libz.so.1* /lib/aarch64-linux-gnu/libz.so.1* 2>/dev/null | head -1)
            echo "zlib encontrado: [$Z]"
            if [ -n "$Z" ]; then
              cp -Lv "$Z" /src/ultrakill_port/libs/arm64/libz.so.1
              cp -v  /src/ultrakill_port/libs/arm64/libz.so.1 /src/ultrakill_port/libs/arm64/libz.so
              ls -la /src/ultrakill_port/libs/arm64/ | grep -i libz
            fi
            # smoke test dentro do MESMO glibc do build
            export LD_LIBRARY_PATH=/src/ultrakill_port/libs/arm64
            ./build-arm64/input_probe --headless --skip-real-loop --libdir ../libs/arm64
          '
        # (o passo 'smoke-test' antigo roda dentro do container agora)

      - name: smoke-test input_probe (headless)
        if: ${{ false }}   # done inside the bullseye container above
        run: true

      - name: gl stack software (glvnd+mesa llvmpipe) do bullseye
        # R36S/ArkOS4Clone: TODOS os sonames GL apontam pro blob bifrost
        # errado e o mesa local so tem vendor glvnd (sem API publica).
        # Embarcar stack completo em libs/arm64/glvndstack/: dispatcher
        # glvnd + libEGL_mesa + swrast(llvmpipe) + gbm + deps. Lento mas
        # real e INDEPENDENTE do kernel/driver da firmware.
        run: |
          docker run --rm -v "$PWD:/src" -w /tmp public.ecr.aws/debian/debian:bullseye-slim bash -ec '
            set -e
            sed -i "s|deb.debian.org|archive.debian.org|g;s|security.debian.org|archive.debian.org|g" /etc/apt/sources.list 2>/dev/null || true
            apt-get -o Acquire::Check-Valid-Until=false update
            mkdir -p /tmp/dls && cd /tmp/dls
            apt-get download libegl1 libglvnd0 libegl-mesa0 libgles2 libglapi-mesa libgbm1 libdrm2 libexpat1 liblz4-1 libzstd1 libllvm11 libgl1-mesa-dri || true
            ls *.deb | wc -l
            mkdir -p x && cd x
            for d in /tmp/dls/*.deb; do dpkg-deb -x "$d" .; done
            S=/src/ultrakill_port/libs/arm64/glvndstack
            mkdir -p $S/dri $S/glvnd
            A=usr/lib/aarch64-linux-gnu
            cp -Lv $A/libEGL.so.1* $S/ 2>/dev/null || true
            cp -Lv $A/libEGL_mesa.so.0* $S/ 2>/dev/null || true
            cp -Lv $A/libGLESv1_CM.so.1* $A/libGLESv2.so.2* $S/ 2>/dev/null || true
            cp -Lv $A/libGLdispatch.so.0* $A/libGLX.so.0* $S/ 2>/dev/null || true
            cp -Lv $A/libgbm.so.1* $A/libdrm.so.2* $A/libexpat.so.1* $S/ 2>/dev/null || true
            cp -Lv $A/liblz4.so.1* $A/libzstd.so.1* $A/libglapi.so.0* $S/ 2>/dev/null || true
            cp -Lv usr/lib/llvm-11/lib/libLLVM-11.so* $A/libLLVM-11.so* $S/ 2>/dev/null || true
            cp -Lv $A/dri/swrast_dri.so $A/dri/kms_swrast_dri.so $S/dri/ 2>/dev/null || true
            cp -v usr/share/glvnd/egl_vendor.d/50_mesa.json $S/glvnd/ 2>/dev/null || true
            chmod -R a+rwX $S   # runner precisa reescrever o json depois
            find $S -maxdepth 1 -name "*.so*" | grep -v glvndstack || true
            du -sh $S
          '
          python3 - <<'PYEOF'
          import json, os
          p = "ultrakill_port/libs/arm64/glvndstack/glvnd/50_mesa.json"
          if os.path.exists(p):
              d = json.load(open(p))
              base = os.path.abspath("ultrakill_port/libs/arm64/glvndstack")
              d["ICD"]["library_path"] = os.path.join(base, d["ICD"]["library_path"])
              json.dump(d, open(p, "w"), indent=2)
              print("vendor json ->", d["ICD"]["library_path"])
          PYEOF
          ls -la ultrakill_port/libs/arm64/glvndstack/

      - name: collect artifacts
        working-directory: ultrakill_port
        run: |
          mkdir -p /tmp/out
          cp -rv libs/arm64/*                       /tmp/out/
          cp -v gamedata/bin/ultrakill             /tmp/out/
          cp -v wrapper/build-arm64/input_probe     /tmp/out/
          cp -v wrapper/build-arm64/egltest         /tmp/out/
          cp -v wrapper/build-arm64/symbol_probe    /tmp/out/ 2>/dev/null || true
          ls -la /tmp/out

      - name: tar for SD drop-in
        run: |
          cd ultrakill_port
          tar czf ../ultrakill-built-arm64.tar.gz \
            -C .. --transform='flags=r;s|^|ultrakill/|' \
            ultrakill_port/libs/arm64/*.so \
            ultrakill_port/gamedata/bin/ultrakill \
            ultrakill_port/wrapper/build-arm64/input_probe \
            ultrakill_port/wrapper/build-arm64/symbol_probe 2>/dev/null \
          || tar czf ../ultrakill-built-arm64.tar.gz \
            libs/arm64/*.so gamedata/bin/ultrakill \
            wrapper/build-arm64/input_probe wrapper/build-arm64/symbol_probe

      - uses: actions/upload-artifact@v4
        with:
          name: ultrakill-arm64-binaries
          path: |
            ultrakill-built-arm64.tar.gz
            ultrakill_port/libs/arm64/**
            ultrakill_port/gamedata/bin/ultrakill
            ultrakill_port/wrapper/build-arm64/egltest
          retention-days: 30

  build-armv7:
    # fallback: se o TSP rodar userspace 32-bit, este job gera libs/armv7
    if: ${{ false }}   # descomente / mude pra true pra habilitar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install armhf cross toolchain
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt update
          sudo apt install -y build-essential cmake pkg-config \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            libsdl2-dev:armhf
      - name: build
        working-directory: ultrakill_port/wrapper
        run: ./build.sh armv7 --cross
      - uses: actions/upload-artifact@v4
        with:
          name: ultrakill-armv7-binaries
          path: ultrakill_port/libs/armv7/*.so
